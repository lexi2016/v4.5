name: V4.5 parallel P0 verification
on:
  push:
    branches:
      - codex/v45-parallel-p0-20261113
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: node --test v45/shared/data.node.test.mjs
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
